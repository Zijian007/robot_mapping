[build-system]
requires = ["setuptools>=68", "wheel", "pybind11>=2.11"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-mapping"
version = "0.4.0"
description = "LiDAR mapping algorithm: LIO, loop closure and occupancy grid"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26.4,<3"]

[project.optional-dependencies]
loop = ["numpy==1.26.4", "scipy>=1.10,<1.16", "gtsam==4.2.2"]
test = ["pytest>=8"]
dev = ["pytest>=8", "ruff==0.17.3"]
runtime = ["PyYAML>=6,<7"]

[project.scripts]
robot-mapping = "robot_mapping.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"robot_mapping.resources" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
required-version = "==0.17.3"
target-version = "py310"
line-length = 100
extend-exclude = ["third_party", "build", "dist", "wheelhouse", "artifacts"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP006", "UP007", "UP035", "UP045"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

